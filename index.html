<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雅芳學院｜線上教育平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 雅芳品牌主色:洋紅 #E5004B / 桃紅 #ED008C —— 沿用 green-* 變數名以全站統一換色 */
  --green-900:#A5003A; --green-700:#E5004B; --green-500:#ED008C; --green-100:#FCE4EE; --green-50:#FDF2F7;
  /* 強調色:改用雅芳深青,取代原橘色 */
  --orange:#007A90; --orange-deep:#005F71; --orange-100:#E2F1F4;
  /* 美容軸:桃紅家族 */
  --beauty:#ED008C; --beauty-100:#FCE4F1; --beauty-deep:#B00068;
  /* 健康檢測:雅芳深青 */
  --health:#005F71; --health-100:#E2F1F4; --health-deep:#004353;
  /* 營養軸 badge 用黃綠(見下方 badge-n 覆寫) */
  --ink:#1A1A1A; --ink-soft:#6B6B6B; --line:#EAE4E7;
  --cream:#FAFAFB; --card:#FFFFFF;
  --danger:#C62828; --danger-100:#FDECEA;
  --olive:#6E7000; --olive-100:#F4F5DC;
  --r:18px; --shadow:0 4px 16px rgba(229,0,75,.08);
  --serif:'Noto Serif TC',serif; --sans:'Noto Sans TC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:#F0EEF0;color:var(--ink);line-height:1.65;font-size:16px}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;
  background-image:radial-gradient(circle at 85% -5%,rgba(229,0,75,.06),transparent 45%),
  radial-gradient(circle at 0% 100%,rgba(237,0,140,.04),transparent 40%)}
/* ── 頂部 ── */
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--green-900),var(--green-700) 70%,#3d8b41);
  color:#fff;padding:14px 18px 12px;box-shadow:0 2px 12px rgba(27,77,30,.25)}
header .brand{display:flex;align-items:center;justify-content:space-between}
header h1{font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:1px}
header h1 small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;opacity:.9;letter-spacing:2.5px;margin-top:1px}
#certBadge{font-size:13px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.6);
  border-radius:99px;padding:4px 10px;font-weight:700}
#certBadge.gold{background:linear-gradient(135deg,#ED008C,#E5004B);border-color:#F8A5D2}
/* ── 內容 ── */
main{padding:18px 16px 96px}
.view{display:none;animation:fadeUp .35s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2.sec{font-family:var(--serif);font-weight:900;font-size:19px;color:var(--green-900);
  margin:22px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;
  border:1px solid rgba(221,231,219,.6);transition:transform .15s}
.card:active{transform:scale(.985)}
.tap{cursor:pointer}
/* 首頁 hero */
.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--green-700);
  position:relative;overflow:hidden;padding:20px 18px}
.hero::before{content:'學 · 說 · 賣';position:absolute;right:-8px;top:-14px;font-family:var(--serif);
  font-size:64px;font-weight:900;opacity:.05;letter-spacing:6px;white-space:nowrap;color:var(--green-700)}
  .hero h3{font-family:var(--serif);font-size:20px;font-weight:900;margin-bottom:4px;color:var(--green-700)}
.hero p{font-size:14px;color:var(--ink-soft)}
.dualbar{margin-top:14px}
.dualbar .row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.dualbar .lbl{width:52px;font-weight:700}
.bar{flex:1;height:9px;background:#EFEBEE;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.bar.b i{background:linear-gradient(90deg,#F8A5D2,var(--beauty))}
.bar.n i{background:linear-gradient(90deg,#C4C63A,#8A8C00)}
.dualbar .pct{width:42px;text-align:right;font-weight:700;font-size:13px;color:var(--ink-soft)}
/* 層級卡 */
.tier{display:flex;gap:13px;align-items:flex-start}
.tier .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0}
.tier.t1 .ico{background:var(--green-100)}
.tier.t2 .ico{background:var(--olive-100)}
.tier.t2b .ico{background:var(--orange-100)}
.tier.t3 .ico{background:#FCE4EE}
.tier h4{font-size:17px;font-weight:900;color:var(--green-900);font-family:var(--serif)}
.tier p{font-size:14px;color:var(--ink-soft);margin-top:2px}
.tier .meta{font-size:13px;margin-top:6px;font-weight:700;color:var(--green-700)}
.lockmark{color:#B0B8AE;font-weight:700;font-size:13px}
/* 課程列表 */
.courseItem{display:flex;align-items:center;gap:12px;padding:14px 15px}
.courseItem .dot{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0}
.axis-b .dot{background:var(--beauty-100)}
.axis-n .dot{background:var(--olive-100)}
.axis-c .dot{background:var(--orange-100)}
.axis-t .dot{background:#FCE4EE}
.courseItem .tt{flex:1}
.courseItem .tt b{font-size:16px;display:block}
.courseItem .tt span{font-size:13px;color:var(--ink-soft)}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700;flex-shrink:0}
.chip.done{background:var(--green-100);color:var(--green-700)}
.chip.todo{background:#F0EEE6;color:#8B917F}
.chip.must{background:var(--danger-100);color:var(--danger)}
.chip.lock{background:#EEE;color:#999}
/* 課程內文 */
.lesson h3{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--green-900);margin-bottom:2px}
.lesson .sub{font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.blk{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;font-size:15.5px}
.blk h5{font-size:16px;font-weight:900;color:var(--green-700);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.blk.warn{border-left:4px solid var(--danger)}
.blk.warn h5{color:var(--danger)}
.blk.talk{border-left:4px solid var(--orange)}
.blk.talk h5{color:var(--orange-deep)}
.blk ul{padding-left:18px;margin:4px 0}
.blk li{margin-bottom:5px}
.blk table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.blk th{background:var(--green-50);color:var(--green-900);padding:6px;border:1px solid var(--line);text-align:left}
.blk td{padding:6px;border:1px solid var(--line);vertical-align:top}
.script{background:var(--orange-100);border-radius:12px;padding:12px 14px;font-size:15px;margin:8px 0;line-height:1.75}
.script b{color:var(--orange-deep)}
.no{background:var(--danger-100);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14.5px}
.yes{background:var(--green-100);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14.5px}
/* 按鈕 */
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:900;
  font-family:var(--sans);cursor:pointer;transition:transform .12s,opacity .2s;letter-spacing:1px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--green-700),var(--green-500));color:#fff;box-shadow:0 4px 14px rgba(229,0,75,.32)}
.btn.orange{background:linear-gradient(135deg,var(--orange-deep),var(--orange));color:#fff;box-shadow:0 4px 14px rgba(0,95,113,.3)}
.btn.blue{background:linear-gradient(135deg,var(--health-deep),var(--health));color:#fff;box-shadow:0 4px 14px rgba(0,95,113,.3)}
.btn.ghost{background:transparent;border:1.5px solid var(--green-700);color:var(--green-700)}
.btn:disabled{opacity:.4;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--green-700);
  font-weight:900;font-size:15px;margin-bottom:12px;cursor:pointer;font-family:var(--sans)}
/* 測驗 */
.qz{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.qz .qt{font-weight:900;font-size:16px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:var(--green-50);border:2px solid transparent;
  border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:15.5px;cursor:pointer;font-family:var(--sans);transition:.15s}
.opt.sel{border-color:var(--green-700);background:var(--green-100);font-weight:700}
.opt.right{border-color:var(--green-700);background:var(--green-100)}
.opt.wrong{border-color:var(--danger);background:var(--danger-100)}
.result{border-radius:var(--r);padding:20px;text-align:center;margin-bottom:14px;color:#fff}
.result.pass{background:linear-gradient(135deg,var(--green-700),var(--green-500))}
.result.fail{background:linear-gradient(135deg,#8D6E63,#A1887F)}
.result .big{font-size:38px}
.result h4{font-family:var(--serif);font-size:20px;margin:6px 0 4px}
.result p{font-size:14.5px;opacity:.9}
/* 檢測共用 */
.stq{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.stq .prog{font-size:13px;font-weight:900;letter-spacing:1px;margin-bottom:6px}
.stq h4{font-size:18px;font-weight:900;margin-bottom:14px}
.stOpt{display:block;width:100%;text-align:left;border:2px solid transparent;
  border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:15.5px;cursor:pointer;font-family:var(--sans)}
.stOpt.pink{background:var(--beauty-100)} .stOpt.pink:active{border-color:var(--beauty)}
.stOpt.blue{background:var(--health-100)} .stOpt.blue:active{border-color:var(--health)}
.bigResult{color:#fff;border-radius:var(--r);padding:22px 18px;text-align:center;margin-bottom:14px}
.bigResult.pink{background:linear-gradient(140deg,var(--beauty-deep),var(--beauty))}
.bigResult.blue{background:linear-gradient(140deg,var(--health-deep),var(--health))}
.bigResult .em{font-size:44px}
.bigResult h3{font-family:var(--serif);font-size:22px;font-weight:900;margin:6px 0 4px}
.bigResult p{font-size:14.5px;opacity:.92}
.tagRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.tagRow span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:99px;
  padding:3px 11px;font-size:11.5px;font-weight:700}
.areaCard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;margin-bottom:11px;font-size:15px}
.areaCard h5{font-size:16px;font-weight:900;color:var(--health-deep);margin-bottom:5px;display:flex;justify-content:space-between}
.areaCard .lv{font-size:11px;font-weight:900;border-radius:99px;padding:1px 9px}
.lv.hi{background:var(--danger-100);color:var(--danger)}
.lv.md{background:var(--orange-100);color:var(--orange-deep)}
.areaCard p{color:var(--ink-soft);font-size:14px;margin:3px 0}
.areaCard .nut{background:var(--green-50);border-radius:10px;padding:8px 11px;margin-top:7px;font-size:14px}
/* 產品指南 */
.serieCard{display:flex;align-items:center;gap:12px;padding:13px 15px}
.serieCard .em{font-size:24px;width:40px;text-align:center}
.serieCard b{font-size:16px;display:block}
.serieCard span{font-size:13px;color:var(--ink-soft)}
.prodRow{border-top:1px dashed var(--line);padding:10px 2px;font-size:14.5px}
.prodRow2{border-top:1px dashed var(--line)}
.prodHead{display:flex;align-items:center;gap:8px;padding:11px 2px}
.pcard{background:var(--green-50);border-radius:12px;padding:12px 14px;margin:2px 0 10px}
.pcard-sec{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.pcard-sec:last-child{border-bottom:none}
.pcard-sec h6{font-size:13px;font-weight:900;color:var(--green-700);margin-bottom:3px}
.pcard-sec p{font-size:13.5px;color:var(--ink);line-height:1.6}
.pcard-sec ul{margin:2px 0 0;padding-left:18px}
.pcard-sec li{font-size:13.5px;color:var(--ink);line-height:1.6;margin-bottom:2px}
.pcard-sec.hl{background:var(--olive-100);border-radius:8px;padding:8px 10px;border-bottom:none;margin:4px 0}
.pcard-sec.hl h6{color:var(--olive)}
.prodRow b{color:var(--green-900)}
.prodRow .tg{color:var(--orange-deep);font-size:13.5px;font-weight:700}
.prodRow p{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.badge-b,.badge-n,.badge-m{font-size:10px;border-radius:99px;padding:1px 8px;font-weight:900;vertical-align:2px;margin-left:5px}
.badge-b{background:var(--beauty-100);color:var(--beauty-deep)}
.badge-n{background:var(--olive-100);color:var(--olive)}
.badge-m{background:linear-gradient(135deg,#FCE4EE,#FAD1E2);color:var(--green-700);border:1px solid #F5B6D2}
/* 底部導覽 */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;font-family:var(--sans);font-size:12px;font-weight:700;
  color:#9AA697;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button .i{font-size:20px;transition:transform .15s}
nav button.on{color:var(--green-700)}
nav button.on .i{transform:translateY(-2px) scale(1.12)}
.note{font-size:13px;color:var(--ink-soft);background:#F3F1E9;border-radius:10px;padding:9px 12px;margin:10px 0;line-height:1.6}
.footer-compliance{font-size:12.5px;color:#98A295;text-align:center;padding:18px 20px 4px;line-height:1.7}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--green-900);color:#fff;
  padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toolCard{display:flex;gap:13px;align-items:center}
.toolCard .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.toolCard b{font-size:17px}
.toolCard p{font-size:14px;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>雅芳學院<small>AVON ACADEMY</small></h1>
      <div id="certBadge">未認證</div>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-v="home" class="on"><span class="i">🏠</span>首頁</button>
    <button data-v="courses"><span class="i">📚</span>課程</button>
    <button data-v="assess"><span class="i">🩺</span>檢測工具</button>
    <button data-v="guide"><span class="i">📋</span>產品指南</button>
    <button data-v="tools"><span class="i">🧰</span>工具箱</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ============================================================
   雅芳學院|線上教育平台
   單一 HTML 檔|手機優先|可部署 GitHub Pages
   ============================================================ */

/* ---------- 進度儲存(localStorage,失敗時退回記憶體) ---------- */
const store = {
  mem:{},
  get(k){ try{ const v = localStorage.getItem('ay_'+k); return v?JSON.parse(v):this.mem[k]||null }catch(e){ return this.mem[k]||null } },
  set(k,v){ this.mem[k]=v; try{ localStorage.setItem('ay_'+k, JSON.stringify(v)) }catch(e){} }
};
let progress = store.get('progress') || {};
function saveProgress(){ store.set('progress', progress); }

/* ---------- 入門課程資料 ---------- */
const COURSES = [
{
 id:'L1-0', axis:'c', icon:'⚠️', must:true,
 title:'合規紅線必修課', sub:'會賣之前,先學會什麼不能說|測驗需 100% 通過',
 goal:'守住紅線 = 保護你的專業信譽與長期客戶信任,也保護公司與你自己。',
 content:[
  {t:'warn', h:'🚫 保健食品:絕對禁止的宣稱', body:`
   <p>保健食品只能使用「<b>功能訴求</b>」用語,任何疾病治療、療效宣稱都違法。</p>
   <div class="no">❌ 「降血壓」「降膽固醇(除非為國家健康食品認證之特定品項,且僅能引用核可字句)」「抗癌」「預防失智」「治療失眠」「治好過敏」「減肥、瘦身」</div>
   <div class="yes">✅ 改用:「支持能量代謝」「幫助免疫調節」「調整體質」「幫助入睡」「促進新陳代謝、幫助維持體態」</div>
   <p style="margin-top:8px">💡 即使學術文獻有相關研究、即使內部教材有提到學理,<b>對客戶一律不可使用療效字眼</b>。內部知識 ≠ 對外話術。</p>`},
  {t:'warn', h:'🚫 保養品:化粧品衛生安全管理法禁區', body:`
   <p>化粧品不得宣稱醫療效能或誇大不實。</p>
   <div class="no">❌ 「治療痘痘」「根治斑點」「換膚」「殺菌」「除皺」「回春」「醫美級」「等同醫美療程」</div>
   <div class="yes">✅ 改用:「維持肌膚健康」「幫助保濕」「維持光澤」「調理肌膚紋理」「提升保養效率」</div>`},
  {t:'norm', h:'🏥 三種情況,一律建議諮詢醫師', body:`
   <ul>
    <li>客戶<b>正在服藥</b>(尤其抗凝血劑)</li>
    <li>客戶有<b>重大疾病</b>(如癌症——改用免疫調節、機能維持語言,不碰治療)</li>
    <li><b>孕婦、哺乳期</b>詢問特定成分</li>
   </ul>
   <div class="script">💬 標準話術:「你有在服藥的話,我會建議先跟醫師確認一下喔!這是我們對專業的堅持,確認沒問題之後,我再幫你規劃最適合的保養方案 😊」</div>
   <p>💡 建議就醫是<b>展現專業高度</b>的做法,不是能力不足——客戶會因此更信任你。</p>`},
  {t:'norm', h:'📐 記住這個判斷口訣', body:`
   <p style="font-size:15px;text-align:center;font-weight:900;color:var(--green-900);padding:8px 0">
   「維持、幫助、調整、支持」可以說<br>「治療、根治、預防疾病」不能說</p>
   <p>不確定的時候,寧可保守,回來查平台的產品指南合規話術。</p>`}
 ],
 quiz:[
  {q:'客戶問:「這個益生菌可以治好我的過敏嗎?」正確回應是?',
   o:['「可以,很多人吃了過敏都好了」','「它能調整體質、幫助維持防護力,若有過敏症狀建議先諮詢醫師」','「保證有效,沒效退費」','「它等於過敏藥」'], a:1},
  {q:'介紹保養品時,下列哪句話「違法」?',

const $ = s=>document.querySelector(s);
const M = $('#main');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function axisName(a){ return a==='b'?'<span class="badge-b">美容軸</span>':a==='n'?'<span class="badge-n">營養軸</span>':a==='t'?'<span class="badge-b">講師培訓</span>':'<span class="badge-b" style="background:var(--orange-100);color:var(--orange-deep)">情境銷售</span>'; }
function calcAxis(){
  const b = COURSES.filter(c=>c.axis==='b'), n = COURSES.filter(c=>c.axis==='n'), c = COURSES.filter(c=>c.axis==='c');
  const done = arr => arr.filter(x=>progress[x.id]).length;
  const bPct = Math.round((done(b)+done(c)*.5)/(b.length+c.length*.5)*100);
  const nPct = Math.round((done(n)+done(c)*.5)/(n.length+c.length*.5)*100);
  return {bPct,nPct, allDone: COURSES.every(x=>progress[x.id])};
}
function updateBadge(){
  const {allDone} = calcAxis();
  const badge = $('#certBadge');
  if(allDone){ badge.textContent='🏅 基礎銷售資格'; badge.classList.add('gold'); }
  else { const d = COURSES.filter(c=>progress[c.id]).length; badge.textContent=`基礎 ${d}/${COURSES.length}`; badge.classList.remove('gold'); }
}
function footer(){ return `<div class="footer-compliance">雅芳學院<br>本平台為內部教育訓練用途</div>`; }

  });
  // 情境銷售(axis-c)
  h += `<h2 class="sec">📙 情境銷售<span style="font-size:11px;font-weight:400;color:var(--ink-soft);margin-left:6px">實戰技巧</span></h2>`;

    const done = progress[m.id];
    h += `<div class="card courseItem ${m.ready?'tap':''} axis-${m.axis}" ${m.ready?`onclick="openAdv('${m.id}')"`:''} style="${m.ready?'':'opacity:.55'}">
      <div class="dot">${m.icon}</div>
      <div class="tt"><b>${m.title}</b><span>${m.sub}</span></div>
      <span class="chip ${m.ready?(done?'done':'todo'):'lock'}">${m.ready?(done?'✅ 通過':'開放中'):'建置中'}</span>
    </div>`;
  });
  // 講師培訓(axis-t)
  h += `<h2 class="sec">📕 講師培訓<span style="font-size:11px;font-weight:400;color:var(--ink-soft);margin-left:6px">帶團隊必備</span></h2>`;

    <div class="blk" style="border-left:4px solid var(--green-500)"><h5>🎯 學習目標</h5><p>${c.goal}</p></div>
    ${c.content.map(blockHTML).join('')}
    <h2 class="sec">✅ 學習測驗${c.passAll?'(需 100% 通過)':''}</h2>
    <div id="quizArea">${renderQuiz(c.quiz)}</div>
    <button class="btn primary" id="submitQuiz" onclick="submitQuiz()">送出答案</button>
  </div>`;
  window.scrollTo(0,0);
}
function openAdv(id){
  const c = ADV_MODULES[id];
  if(!c) return;
  quizState = {cid:id, answers:{}, submitted:false, isAdv:true};
  M.innerHTML = `<div class="view active lesson">
    <button class="back" onclick="go('courses')">‹ 返回課程列表</button>
    <h3>${c.icon} ${c.title} ${axisName(c.axis)}</h3>
    <div class="sub">${c.sub}</div>
    ${c.content.map(blockHTML).join('')}
    <h2 class="sec">✅ 學習測驗(需 100% 通過)</h2>
    <div id="quizArea">${renderQuiz(c.quiz)}</div>
    <button class="btn primary" id="submitQuiz" onclick="submitQuiz()">送出答案</button>
  </div>`;
  window.scrollTo(0,0);
}
function renderQuiz(quiz){
  return quiz.map((q,i)=>`<div class="qz"><div class="qt">Q${i+1}. ${q.q}</div>
    ${q.o.map((o,j)=>`<button class="opt" id="q${i}o${j}" onclick="pick(${i},${j})">${'ABCD'[j]}. ${o}</button>`).join('')}
  </div>`).join('');
}
function pick(qi,oi){
  if(quizState.submitted) return;
  quizState.answers[qi]=oi;
  const quiz = quizState.isAdv?ADV_MODULES[quizState.cid].quiz:COURSES.find(x=>x.id===quizState.cid).quiz;
  quiz[qi].o.forEach((_,j)=>{ $(`#q${qi}o${j}`).classList.toggle('sel', j===oi); });
}
function submitQuiz(){
  const c = quizState.isAdv?ADV_MODULES[quizState.cid]:COURSES.find(x=>x.id===quizState.cid);
  const quiz = c.quiz;
  if(Object.keys(quizState.answers).length < quiz.length){ toast('還有題目沒作答喔!'); return; }
  quizState.submitted = true;
  let correct = 0;
  quiz.forEach((q,i)=>{
    const my = quizState.answers[i];
    q.o.forEach((_,j)=>{
      const el = $(`#q${i}o${j}`);
      if(j===q.a) el.classList.add('right');
      else if(j===my) el.classList.add('wrong');
    });
    if(my===q.a) correct++;
  });
  const need = c.passAll ? quiz.length : Math.ceil(quiz.length*0.75);
  const pass = correct >= need;
  if(pass){ progress[quizState.cid]=true; saveProgress(); updateBadge(); }
  const {allDone} = calcAxis();
  const r = document.createElement('div');
  r.className = `result ${pass?'pass':'fail'}`;
  r.innerHTML = `<div class="big">${pass?'🎉':'💪'}</div>
    <h4>${pass?'恭喜通過!':'再挑戰一次'}</h4>
    <p>答對 ${correct}/${quiz.length} 題(通過標準:${need} 題)</p>
    ${pass&&allDone&&!quizState.isAdv?'<p style="margin-top:6px;font-weight:900">🏅 入門六堂全數通過,取得「基礎銷售資格」,進階層已解鎖!</p>':''}`;
  const area = $('#quizArea');
  area.parentNode.insertBefore(r, area);
  $('#submitQuiz').outerHTML = pass
    ? `<button class="btn primary" onclick="go('courses')">返回課程列表 ›</button>`
    : `<button class="btn orange" onclick="${quizState.isAdv?`openAdv('${quizState.cid}')`:`openCourse('${quizState.cid}')`}">重新閱讀並再測一次</button>`;
  r.scrollIntoView({behavior:'smooth'});
}

/* ---- 膚質檢測 ---- */
let skinIdx = 0, skinScore = {};
function startSkin(){
  skinIdx=0; skinScore={dry:0,oily:0,combo:0,sens:0,normal:0,aging:0,dull:0};
  renderSkinQ();
}
function renderSkinQ(){
  const q = SKIN_Q[skinIdx];
  $('#assessArea').innerHTML = `<div class="stq">
    <div class="prog" style="color:var(--beauty)">🧖‍♀️ 膚質檢測|QUESTION ${skinIdx+1} / ${SKIN_Q.length}</div>
    <div class="bar" style="height:6px;background:var(--beauty-100);margin-bottom:14px"><i style="width:${(skinIdx)/SKIN_Q.length*100}%;background:var(--beauty)"></i></div>
    <h4>${q.q}</h4>
    ${q.o.map((o,j)=>`<button class="stOpt pink" onclick="answerSkin(${j})">${o.t}</button>`).join('')}
  </div>`;
  $('#assessArea').scrollIntoView({behavior:'smooth'});
}
function answerSkin(j){
  const s = SKIN_Q[skinIdx].o[j].s;
  Object.keys(s).forEach(k=>skinScore[k]+=s[k]);
  skinIdx++;
  if(skinIdx < SKIN_Q.length) renderSkinQ(); else showSkinResult();
}
function showSkinResult(){
  let type;
  if(skinScore.sens >= 3) type = 'sens';
  else {
    const main = ['dry','oily','combo','normal'];
    type = main.reduce((a,b)=> skinScore[b]>skinScore[a]?b:a, 'normal');
    if(skinScore.dry>0 && skinScore.oily>0 && Math.abs(skinScore.dry-skinScore.oily)<=1 && skinScore.combo>=2) type='combo';
  }
  const T = SKIN_TYPES[type];
  const tags = [];
  if(skinScore.aging>=2) tags.push('🕰️ 光老化/初老守護');
  if(skinScore.dull>=2) tags.push('💫 暗沉・透亮需求');
  if(skinScore.sens>0 && type!=='sens') tags.push('🌷 偶發性敏感');
  $('#assessArea').innerHTML = `
  <div class="bigResult pink">
    <div class="em">${T.em}</div>
    <h3>${T.name}</h3>
    <p>${T.desc}</p>
    ${tags.length?`<div class="tagRow">${tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}
  </div>
  <div class="blk"><h5>🧴 外在保養方向</h5><ul>${T.care.map(c=>`<li>${c}</li>`).join('')}</ul></div>
  <div class="blk"><h5>🥗 由內而外・營養搭配</h5><p>${T.inner}</p>
  <button class="btn ghost" style="margin-top:10px" onclick="go('guide')">📋 查看產品指南 ›</button></div>
  <div class="note">⚠️ 本結果為日常保養建議參考,非醫療診斷。若有持續泛紅、刺痛、濕疹或其他明顯皮膚異常,請諮詢皮膚科醫師。</div>
  <button class="btn orange" onclick="startSkin()">🔄 重新檢測</button>`;
  window.scrollTo(0,0);
}

/* ---- 健康檢測 ---- */
let hIdx = 0, hScores = [];
function startHealth(){
  hIdx=0; hScores=[];
  renderHealthQ();
}
function renderHealthQ(){
  const q = HEALTH_Q[hIdx];
  $('#assessArea').innerHTML = `<div class="stq">
    <div class="prog" style="color:var(--health)">🩺 健康檢測|QUESTION ${hIdx+1} / ${HEALTH_Q.length}</div>
    <div class="bar" style="height:6px;background:var(--health-100);margin-bottom:14px"><i style="width:${(hIdx)/HEALTH_Q.length*100}%;background:var(--health)"></i></div>
    <h4>${q.em} ${q.area}|${q.q}</h4>
    ${HEALTH_OPTS.map((o,j)=>`<button class="stOpt blue" onclick="answerHealth(${j})">${o.t}</button>`).join('')}
  </div>`;
  $('#assessArea').scrollIntoView({behavior:'smooth'});
}
function answerHealth(j){
  hScores.push(HEALTH_OPTS[j].s);
  hIdx++;
  if(hIdx < HEALTH_Q.length) renderHealthQ(); else showHealthResult();
}
function showHealthResult(){
  const total = hScores.reduce((a,b)=>a+b,0);
  const max = HEALTH_Q.length*3;
  const pct = Math.round((max-total)/max*100);
  let em,label,msg;
  if(pct>=85){em='🌟';label='狀態很棒';msg='整體維持得很好!持續均衡飲食與規律作息,用基礎營養打底讓好狀態更持久。';}
  else if(pct>=65){em='🙂';label='大致良好';msg='整體不錯,但有幾個面向開始出現訊號,及早保養最省力。';}
  else if(pct>=45){em='😕';label='需要留意';msg='身體正在發出訊號,建議針對下方重點面向開始日常調理。';}
  else {em='😩';label='建議積極調整';msg='多個面向明顯困擾,建議調整作息並針對重點面向保養;若有持續不適,請先諮詢醫師。';}
  const ranked = HEALTH_Q.map((q,i)=>({...q, score:hScores[i]}))
    .filter(x=>x.score>=2).sort((a,b)=>b.score-a.score).slice(0,3);
  $('#assessArea').innerHTML = `
  <div class="bigResult blue">
    <div class="em">${em}</div>
    <h3>整體健康分數 ${pct} 分|${label}</h3>
    <p>${msg}</p>
  </div>
  ${ranked.length ? `<h2 class="sec">🎯 最需要關注的面向</h2>` + ranked.map(a=>`
    <div class="areaCard">
      <h5>${a.em} ${a.area}<span class="lv ${a.score===3?'hi':'md'}">${a.score===3?'明顯困擾':'需留意'}</span></h5>
      <p>${a.desc}</p>
      <div class="nut">💊 ${a.nut}<br>🛒 ${a.prod}</div>
    </div>`).join('')
    : `<div class="blk"><h5>👏 沒有明顯困擾面向</h5><p>維持目前的好習慣,以基礎營養(綜合維生素、益生菌)日常打底即可。</p></div>`}
  <button class="btn ghost" onclick="go('guide')">📋 查看產品指南 ›</button>
  <div class="note" style="margin-top:10px">⚠️ 本結果為保健方向參考,非醫療診斷。正在服藥(尤其抗凝血劑)、有重大疾病或孕哺期,補充前請先諮詢醫師。</div>
  <button class="btn blue" onclick="startHealth()">🔄 重新檢測</button>`;
  window.scrollTo(0,0);
}

/* ---- 產品指南(兩層展開:系列 → 品項簡介 → 完整卡) ---- */
let openSerie = null;
let openProd = null;
function prodCard(p){
  const li = a => a.map(x=>`<li>${x}</li>`).join('');
  return `<div class="pcard">
    <div class="pcard-sec"><h6>📋 基本資料</h6><p>${p.t}</p></div>
    <div class="pcard-sec"><h6>🧬 核心成分</h6><ul>${li(p.ing)}</ul></div>
    <div class="pcard-sec hl"><h6>💡 主成分功效</h6><ul>${li(p.eff)}</ul></div>
    <div class="pcard-sec"><h6>🎯 產品訴求</h6><p>${p.appeal}</p></div>
    <div class="pcard-sec"><h6>👥 適用對象</h6><p>${p.who}</p></div>
    <div class="pcard-sec"><h6>🕐 使用方式</h6><p>${p.how}</p></div>
    <div class="pcard-sec"><h6>🔗 搭配組合</h6><p>${p.mix}</p></div>
  </div>`;
}
function serieHTML(g,i,key){
  const sid = key+i;
  const isOpen = openSerie===sid;
  let inner='';
  if(isOpen){
    if(g.pending){
      inner = `<div class="note" style="margin:6px 0">🧴 本系列資料建置中——待官方素材到位後完整上線。</div>`;
    } else {
      // 營養品與美容品皆用兩層——品項簡介 → 點開完整卡
      inner = g.items.map((p,j)=>{
        const pid = sid+'_'+j;
        const pOpen = openProd===pid;
        return `<div class="prodRow2" id="prod_${pid}">
          <div class="prodHead tap" onclick="event.stopPropagation();toggleProd('${pid}')">
            <div style="flex:1"><b>${p.n}</b>${p.pendingItem?' <span class="chip lock" style="font-size:10px">待補</span>':''}<br><span class="tg">${p.t.split('・').slice(0,2).join('・')}</span></div>
            <span style="color:var(--ink-soft);font-size:13px">${pOpen?'收合 ▾':'完整資料 ›'}</span>
          </div>
          ${pOpen?prodCard(p):''}
        </div>`;
      }).join('');
    }
  }
  return `<div class="card" id="serie_${sid}" style="padding:0;overflow:hidden">
    <div class="serieCard tap" onclick="toggleSerie('${key}',${i})">
      <div class="em">${g.em}</div>
      <div style="flex:1"><b>${g.name} ${key==='b'?'<span class="badge-b">美容</span>':'<span class="badge-n">營養</span>'}${g.main?'<span class="badge-m">⭐主力</span>':''}</b><span>${g.desc}</span></div>
      <span style="color:var(--ink-soft)">${isOpen?'▾':'›'}</span>
    </div>
    ${isOpen?`<div style="padding:2px 13px 13px">${inner}</div>`:''}
  </div>`;
}
function vGuide(){
  let h = `<div class="note" style="margin-top:2px">📖 <b>雙軸產品指南</b>|點系列展開品項,再點品項看完整講解卡(基本資料、核心成分、主成分功效、產品訴求、適用對象、使用方式、搭配組合)。⭐ 為主力系列。</div>`;
  h += `<h2 class="sec">🥗 營養品<span style="font-size:11px;font-weight:400;color:var(--ink-soft);margin-left:6px">點品項看完整資料</span></h2>`;
  GUIDE_N.forEach((g,i)=>{ h += serieHTML(g,i,'n'); });
  h += `<h2 class="sec">🌸 美容品</h2>`;
  GUIDE_B.forEach((g,i)=>{ h += serieHTML(g,i,'b'); });
  h += `<div class="footer-compliance">產品功效說明均為合規功能訴求用語<br>優惠與方案依當月公告為準<br>本平台為內部教育訓練用途</div>`;
  return h;
}
function toggleSerie(key,i){
  const sid=key+i;
  const wasOpen = openSerie===sid;
  openSerie = wasOpen?null:sid; openProd=null;
  M.innerHTML = `<div class="view active">${vGuide()}</div>`;
  // 展開時捲動到剛點的系列(用錨點),不跳回頂端
  if(!wasOpen){
    requestAnimationFrame(()=>{
      const el = document.getElementById('serie_'+sid);
      if(el) el.scrollIntoView({behavior:'auto', block:'start'});
    });
  }
}
function toggleProd(pid){
  openProd = openProd===pid?null:pid;
  M.innerHTML = `<div class="view active">${vGuide()}</div>`;
  requestAnimationFrame(()=>{
    const el = document.getElementById('prod_'+pid);
    if(el) el.scrollIntoView({behavior:'auto', block:'nearest'});
  });
}
